spring.application.name=musicmania-api
server.port=${PORT:4000}

# ---------- Base de datos (MySQL) ----------
# Local: localhost:3306. Aiven: define DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME y DB_SSL_MODE=REQUIRED
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:musicmania}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Las tablas ya existen (database/01_schema.sql): Hibernate NO las crea ni modifica.
spring.jpa.hibernate.ddl-auto=none
# Usa los nombres tal como están en las anotaciones (las tablas están en MAYÚSCULAS)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# En producción define JWT_SECRET (mínimo 32 caracteres). El valor por defecto es SOLO para desarrollo.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiala-en-produccion-123456}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# ---------- CORS ----------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# ---------- Usuarios de prueba ----------
# true = crea admin y clientes de ejemplo al iniciar (solo si no existen)
app.seed.usuarios=${SEED_USUARIOS:true}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
